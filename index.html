<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eaf4ff">
<title>Speaking Stars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style>
<style>
/* Layout: one centered stage card under a compact header; level + theme chips on top, big picture and one action row below. */
:root{
  --bg:#eaf4ff; --surface:#ffffff; --ink:#1b2a4a; --muted:#5d6f91;
  --accent:#ff7a3d; --accent-ink:#ffffff; --star:#ffb400; --ok:#2fa866; --line:#cfe0f5; --chip:#dcebff; --warn:#c2410c;
  --f-display:'Fredoka','Zen Maru Gothic','Hiragino Maru Gothic ProN',system-ui,sans-serif;
  --f-body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a33; --surface:#182548; --ink:#eef3ff; --muted:#9db0d8; --accent:#ff8a52; --accent-ink:#1b1206; --star:#ffc933; --ok:#4cc98a; --line:#2b3c6b; --chip:#233459; --warn:#ffa470; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a33; --surface:#182548; --ink:#eef3ff; --muted:#9db0d8; --accent:#ff8a52; --accent-ink:#1b1206; --star:#ffc933; --ok:#4cc98a; --line:#2b3c6b; --chip:#233459; --warn:#ffa470; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);padding-inline:16px;padding-block:16px 32px;font-size:16px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-size:28px;margin:0;letter-spacing:.01em;text-wrap:balance}
.total{font-family:var(--f-display);font-weight:600;font-size:20px;display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-variant-numeric:tabular-nums}
.total svg{width:22px;height:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 15px var(--f-body);background:var(--chip);color:var(--ink);border:2px solid transparent;border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.levels .chip{flex:1 1 0;text-align:center;padding-inline:8px;font-size:14px}
.levels .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:28px;padding:20px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.progress{display:flex;gap:8px;align-self:stretch;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--chip)}
.dot.done{background:var(--star)}
.dot.now{background:var(--accent)}
.pic svg{width:min(78vw,300px);height:auto;display:block}
.pic{font-size:clamp(96px,32vw,150px);line-height:1.1;user-select:none}
.mode{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.say{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,8vw,38px);text-align:center;text-wrap:balance;min-height:1.3em;margin:0}
.say.hidden{color:var(--muted);letter-spacing:.2em}
.jp{margin:0;color:var(--muted);text-align:center;font-size:15px;line-height:1.6;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font:700 17px var(--f-body);border:0;border-radius:18px;padding:14px 20px;cursor:pointer;background:var(--chip);color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);color:#fff;font-size:20px;padding:16px 26px}
.btn.mic{background:var(--ok);color:#fff;font-size:22px;padding:18px 34px;border-radius:999px}
.btn.mic.on{background:var(--accent);color:var(--accent-ink);animation:pulse 1.1s ease-in-out infinite}
.btn.small{font-size:14px;padding:8px 12px;border-radius:12px;background:transparent;color:var(--muted);text-decoration:underline}
.btn:active{transform:translateY(1px)}
.parent{align-self:stretch;border-top:2px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.parent small{color:var(--muted);font-size:13px;text-align:center;line-height:1.6}
.heard{margin:0;font-size:14px;color:var(--muted);text-align:center;overflow-wrap:anywhere}
.msg{margin:0;font-weight:700;text-align:center;text-wrap:balance;line-height:1.5}
.msg.warn{color:var(--warn)}
.praise{font-family:var(--f-display);font-weight:700;font-size:clamp(36px,11vw,54px);color:var(--accent);text-align:center;margin:0}
.done-card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:8px}
.done-card h2{font-family:var(--f-display);font-size:34px;margin:0}
.big-stars{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.big-stars svg{width:34px;height:34px}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.pop,.btn.mic.on{animation:none}}
.seg .chip{flex:1 1 0;text-align:center}
.seg .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.progress{flex-wrap:wrap}
.sp-label{align-self:flex-start;font-weight:700}
.sp-area{width:100%;box-sizing:border-box;min-height:220px;font:500 17px/1.7 var(--f-display);background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:12px}
.note{font-size:13px;color:var(--muted);text-align:center;margin:0;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Speaking Stars</h1>
    <div class="total" aria-label="あつめたスター"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--star)" d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.7 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg><span id="total">0</span></div>
  </header>
  <div class="chips seg" id="modes" role="group" aria-label="モード"></div>
  <div class="chips levels" id="levels" role="group" aria-label="むずかしさ"></div>
  <div class="chips" id="chips" role="group" aria-label="テーマ"></div>
  <main class="stage" id="stage"></main>
  <p class="note" id="note"></p>
</div>

<script>
const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--star)" d="M12 2l3 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.7 5.7 21.4l1.5-7.1L1.8 9.4 9 8.6z"/></svg>';

/* Hand-drawn trains, told apart by shape and colour (emoji cannot show which line a train is). */
let svgN=0;
function trainSVG(body,stripe,shape){
  const id='c'+(svgN++),ink='style="stroke:var(--ink)" stroke-width="3"';
  let s='<svg viewBox="0 0 230 110" role="img" aria-hidden="true"><rect x="0" y="96" width="230" height="4" rx="2" style="fill:var(--muted)"/>';
  if(shape==='bullet'){
    const d='M8,84 L8,44 Q8,30 24,30 L122,30 C165,30 196,54 220,80 L220,84 Z';
    s+='<clipPath id="'+id+'"><path d="'+d+'"/></clipPath><path d="'+d+'" fill="'+body+'"/>';
    if(stripe)s+='<rect x="0" y="62" width="230" height="9" fill="'+stripe+'" clip-path="url(#'+id+')"/>';
    s+='<path d="M132,38 C154,38 172,50 186,64 L132,64 Z" fill="#bfe3ff" '+ink+'/>';
    for(let i=0;i<4;i++)s+='<rect x="'+(22+i*27)+'" y="40" width="17" height="13" rx="3" fill="#bfe3ff" '+ink+'/>';
    s+='<path d="'+d+'" fill="none" '+ink+'/>';
    [[40],[86],[150]].forEach(w=>{s+='<circle cx="'+w[0]+'" cy="89" r="7" style="fill:var(--ink)"/>'});
  }else{
    s+='<rect x="10" y="24" width="210" height="62" rx="13" fill="'+body+'" '+ink+'/>';
    if(stripe)s+='<rect x="11" y="62" width="208" height="9" fill="'+stripe+'"/>';
    for(let i=0;i<5;i++)s+='<rect x="'+(24+i*38)+'" y="34" width="26" height="19" rx="3" fill="#bfe3ff" '+ink+'/>';
    s+='<circle cx="210" cy="76" r="3" fill="#ffe27a"/>';
    [[42],[82],[150],[190]].forEach(w=>{s+='<circle cx="'+w[0]+'" cy="90" r="7" style="fill:var(--ink)"/>'});
  }
  return s+'</svg>';
}

/* item: [picture, word with article, plural (for "I like ..."), japanese, {misheard: intended}] */
const CATS={
  trains:{label:'でんしゃ',q:'What train is this?',adj:'fast',items:[
    [trainSVG('#f4f7fb','#1f5fbf','bullet'),'the Shinkansen','the Shinkansen','しんかんせん（白と青）',{'bullet train':'shinkansen','shin kansen':'shinkansen','shinkanzen':'shinkansen'}],
    [trainSVG('#ffd21f','#1f5fbf','bullet'),'Doctor Yellow','Doctor Yellow','ドクターイエロー（黄色い新幹線）',{'dr':'doctor'}],
    [trainSVG('#d9dee5','#9acd32','flat'),'the Yamanote Line','the Yamanote Line','やまのてせん（黄緑の線）',{'yamamoto':'yamanote','yama note':'yamanote','yamanoti':'yamanote'}],
    [trainSVG('#f15a22','','flat'),'the Chuo Line','the Chuo Line','ちゅうおうせん（オレンジ色）',{'joe line':'chuo line','chow line':'chuo line','cho line':'chuo line','chu line':'chuo line'}],
    [trainSVG('#d9dee5','#00b2e5','flat'),'the Keihin-Tohoku Line','the Keihin-Tohoku Line','けいひんとうほくせん（水色の線）',{'kay hin':'keihin','k hin':'keihin','to hoku':'tohoku'}],
    [trainSVG('#f4f7fb','#d81b2c','flat'),'the Narita Express','the Narita Express','なりたエクスプレス（白と赤）'],
    ['🚇','the subway','the subway','ちかてつ',{'metro':'subway'}],
    ['🚝','the monorail','the monorail','モノレール']]},
  animals:{label:'どうぶつ',q:'What animal is this?',items:[
    ['🦁','a lion','lions','ライオン'],['🐘','an elephant','elephants','ぞう'],['🐶','a dog','dogs','いぬ'],['🐱','a cat','cats','ねこ'],
    ['🐰','a rabbit','rabbits','うさぎ'],['🐼','a panda','pandas','パンダ'],['🐧','a penguin','penguins','ペンギン'],['🦒','a giraffe','giraffes','キリン']]},
  dino:{label:'きょうりゅう',q:'What is this?',items:[
    ['🦖','a T rex','T rexes','ティラノサウルス',{trex:'t rex','tea rex':'t rex'}],['🦕','a dinosaur','dinosaurs','きょうりゅう'],['🥚','an egg','eggs','たまご'],
    ['🦴','a bone','bones','ほね'],['🌋','a volcano','volcanoes','かざん'],['🐾','a footprint','footprints','あしあと']]},
  vehicles:{label:'のりもの',q:'What is this?',items:[
    ['🚆','a train','trains','でんしゃ'],['🚗','a car','cars','くるま'],['🚌','a bus','buses','バス'],['✈️','an airplane','airplanes','ひこうき'],
    ['🚒','a fire truck','fire trucks','しょうぼうしゃ'],['🚢','a ship','ships','ふね'],['🚁','a helicopter','helicopters','ヘリコプター']]},
  space:{label:'うちゅう',q:'What is this?',items:[
    ['🚀','a rocket','rockets','ロケット'],['🌙','the moon','the moon','つき'],['⭐','a star','stars','ほし'],['🪐','a planet','planets','わくせい'],
    ['🌍','the earth','the earth','ちきゅう'],['☀️','the sun','the sun','たいよう'],['👽','an alien','aliens','うちゅうじん']]},
  sea:{label:'うみ',q:'What animal is this?',items:[
    ['🐬','a dolphin','dolphins','イルカ'],['🦈','a shark','sharks','サメ'],['🐙','an octopus','octopuses','タコ'],['🐢','a turtle','turtles','かめ'],
    ['🦀','a crab','crabs','カニ'],['🐳','a whale','whales','くじら'],['🐠','a fish','fish','さかな']]},
  bugs:{label:'むし',q:'What is this?',items:[
    ['🦋','a butterfly','butterflies','ちょうちょ'],['🐞','a ladybug','ladybugs','てんとうむし'],['🐝','a bee','bees','はち'],
    ['🐜','an ant','ants','あり'],['🕷️','a spider','spiders','クモ'],['🐛','a caterpillar','caterpillars','いもむし']]},
  sports:{label:'スポーツ',q:'What is this?',items:[
    ['⚽','a soccer ball','soccer balls','サッカーボール'],['⚾','a baseball','baseballs','やきゅうボール'],['🏀','a basketball','basketballs','バスケットボール'],
    ['🎾','a tennis ball','tennis balls','テニスボール'],['🏐','a volleyball','volleyballs','バレーボール']]},
  colors:{label:'いろ',q:'What color is this?',items:[
    ['🔴','red','red','あか',{read:'red'}],['🔵','blue','blue','あお',{blew:'blue'}],['🟡','yellow','yellow','きいろ'],['🟢','green','green','みどり'],
    ['🟠','orange','orange','オレンジ'],['🟣','purple','purple','むらさき']]},
  food:{label:'たべもの',q:'What food is this?',items:[
    ['🍎','an apple','apples','りんご'],['🍌','a banana','bananas','バナナ'],['🍓','a strawberry','strawberries','いちご'],['🍙','a rice ball','rice balls','おにぎり'],
    ['🍪','a cookie','cookies','クッキー'],['🥛','milk','milk','ぎゅうにゅう'],['🍕','a pizza','pizzas','ピザ'],['🍦','an ice cream','ice creams','アイス']]},
  shop:{label:'おみせやさん',shop:true,items:[
    ['🍎','an apple','apples','りんご'],['🍌','a banana','bananas','バナナ'],['🍓','a strawberry','strawberries','いちご'],
    ['🍪','a cookie','cookies','クッキー'],['🥛','milk','milk','ぎゅうにゅう'],['🍙','a rice ball','rice balls','おにぎり']]}
};
const LEVELS=[[3,'Lv3 こたえる'],[4,'Lv4 くわしく'],[5,'Lv5 かいわ']];
const ADJ=['cool','fun','cute','fast','big','beautiful','strong'];
const DEFAULT_SPEECH='Hello, everyone!\nMy name is Taro.\nI am six years old.\nI like trains.\nMy favorite train is the Shinkansen.\nIt is very fast!\nThank you for listening.';
const PRAISE=[['Great job!','すごい！'],['Perfect!','かんぺき！'],['Awesome!','さいこう！'],['You did it!','やったね！'],['Wow, super!','スーパー！'],['Nice English!','じょうず！']];
const ROUND=5;

/*JUDGE*/
function norm(s){
  return String(s).toLowerCase().replace(/\bit is\b/g,'its').replace(/\bthey are\b/g,'theyre').replace(/\bi am\b/g,'im')
    .replace(/['’]/g,'').replace(/[-–]/g,' ').replace(/[^a-z0-9 ]/g,' ').replace(/\b(a|an|the)\b/g,' ').replace(/\s+/g,' ').trim();
}
function applyAlt(s,alt){
  if(!alt)return s;
  Object.keys(alt).forEach(k=>{s=s.replace(new RegExp('\\b'+k+'\\b','g'),alt[k])});
  return s;
}
function lev(a,b){
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++){d[i]=[i]}
  for(let j=1;j<=n;j++){d[0][j]=j}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}
  return d[m][n];
}
function tokMatch(t,r){
  if(t===r)return true;
  if(Math.min(t.length,r.length)<3)return false;
  const d=lev(t,r);
  return d<=1||(t.length>=7&&d<=2);
}
function score(target,heard){
  const T=target.split(' ').filter(Boolean),H=heard.split(' ').filter(Boolean);
  if(!T.length)return 0;
  let hit=0;
  T.forEach(t=>{if(H.some(h=>tokMatch(t,h)))hit++});
  return hit/T.length;
}
function judge(targets,keyText,alts,alt,opts){
  opts=opts||{};
  const list=Array.isArray(targets)?targets:[targets];
  const K=norm(keyText||'');
  let best=0,keyHit=false,pass=false,words=0;
  alts.forEach(a=>{
    const h=applyAlt(norm(a),alt);
    words=Math.max(words,h.split(' ').filter(Boolean).length);
    if(K&&score(K,h)===1)keyHit=true;
    list.forEach(t=>{
      const T=norm(t);
      const need=opts.need||(T.split(' ').length<=2?1:0.75);
      const sc=score(T,h);
      best=Math.max(best,sc);
      if(sc>=need)pass=true;
    });
  });
  if(opts.minWords)pass=words>=opts.minWords;
  return {pass:pass,keyHit:keyHit,best:best,words:words};
}
/*ENDJUDGE*/

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const $=id=>document.getElementById(id);
let cat='trains',mode='quiz',level=3,deck=[],ci=0,si=0,session=0,total=0;
let phase='ask',revealed=false,attempts=0,listening=false,heard='',msg='',warn=false,earned=0,praiseIdx=0,timer=null,micOK=!!SR,started=false,rec=null;
try{total=parseInt(localStorage.getItem('ss-total')||'0',10)||0;level=parseInt(localStorage.getItem('ss-level')||'3',10)||3}catch(e){}
if(level<3)level=3;
let speechText=DEFAULT_SPEECH;
try{speechText=localStorage.getItem('ss-speech')||DEFAULT_SPEECH}catch(e){}
function save(){try{localStorage.setItem('ss-total',String(total));localStorage.setItem('ss-level',String(level))}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function speak(t,rate){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||.85;u.pitch=1.1;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
const bare=w=>w.replace(/^(a|an|the) /i,'');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function speechCards(lines){
  const cards=[];
  lines.forEach((l,i)=>cards.push(['💬',l,'','',null,[{speak:l,target:l,hidden:false,key:l,tip:'まず1文ずつ、まねして言います。（'+(i+1)+'/'+lines.length+'）'}]]));
  lines.forEach((l,i)=>{
    const cue=l.split(/\s+/).slice(0,2).join(' ');
    cards.push(['🎤',l,'','',null,[{speak:l,auto:cue+'…',target:l,hidden:true,key:l,tip:'次は、見ないで言います。音声のヒントは最初の2語だけです。（'+(i+1)+'/'+lines.length+'）'}]]);
  });
  const full=lines.join(' ');
  cards.push(['🌟',full,'','',null,[{speak:full,auto:'Now, your speech!',target:full,hidden:true,key:full,need:0.6,tip:'しあげです。ぜんぶ通してスピーチします。最後まで言えたら大成功です。'}]]);
  return cards;
}
function buildSteps(it){
  if(it[5])return it[5];
  const c=CATS[cat],w=it[1],pl=it[2],key=bare(w),ans="It's "+w+".",adj=c.adj||'cool';
  const ask=(sp,t,tip,k,o)=>Object.assign({speak:sp,target:t,hidden:true,key:k||key,tip:tip},o||{});
  if(c.shop){
    if(level===3)return[ask('What do you want?','I want '+w+', please.','お店の人の質問に、自分で注文します。'),ask('Here you are.','Thank you very much!','商品を受け取ったお礼を言います。','thank you')];
    if(level===4)return[ask('Hello! Can I help you?','Can I have '+w+', please?','話しかけられたら、ていねいに注文します。'),ask('It is three hundred yen.','Here you are. Thank you!','お金を渡すつもりで言います。','thank you')];
    return[ask('Hello! What would you like today?','Hello! I would like '+w+', please.','自由に注文します。5語以上で言えたら合格です。',key,{open:true,minWords:5}),ask('Anything else?','No, thank you. That is all.','「ほかにありますか？」に自由に返します。3語以上で合格です。','thank',{open:true,minWords:3})];
  }
  if(level===3)return[ask(c.q,ans,'質問を聞いて、文で答えます。'),ask('Do you like '+pl+'?','Yes, I like '+pl+'.','「好き？」の質問に答えます。',pl)];
  if(level===4){
    const whys=[];ADJ.forEach(a=>{whys.push("Because it's "+a+'.');whys.push("Because they're "+a+'.')});
    return[ask(c.q,ans+' I like '+pl+'.','2つの文で答えます。「これは〇〇です。〇〇が好きです。」',key),
      ask('Why do you like '+pl+'?',"Because it's "+adj+'.','「どうして好き？」に、理由を言います。どんな言葉でもOKです。','because',{targets:whys})];
  }
  return[ask('Do you like '+pl+'? Why?','Yes, I like '+pl+" because it's "+adj+'!','自由にお話しします。5語以上で言えたら合格です。',key,{open:true,minWords:5}),
    ask('Tell me more about '+key+'!','I see '+pl+' every day. They are so '+adj+'!','思ったことを自由に話します。5語以上で言えたら合格です。',key,{open:true,minWords:5})];
}
function cur(){return buildSteps(deck[ci])[si]}

function renderChips(){
  $('modes').innerHTML=[['quiz','クイズ'],['speech','スピーチ練習']].map(m=>'<button class="chip" data-m="'+m[0]+'" aria-pressed="'+(m[0]===mode)+'">'+m[1]+'</button>').join('');
  $('modes').querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;start()});
  $('levels').hidden=$('chips').hidden=(mode==='speech');
  $('levels').innerHTML=LEVELS.map(l=>'<button class="chip" data-l="'+l[0]+'" aria-pressed="'+(l[0]===level)+'">'+l[1]+'</button>').join('');
  $('levels').querySelectorAll('button').forEach(b=>b.onclick=()=>{level=parseInt(b.dataset.l,10);save();start()});
  $('chips').innerHTML=Object.entries(CATS).map(([k,c])=>'<button class="chip" data-k="'+k+'" aria-pressed="'+(k===cat)+'">'+c.label+'</button>').join('');
  $('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.k;start()});
}
function resetStep(){phase='ask';revealed=false;attempts=0;listening=false;heard='';msg='';warn=false;clearTimeout(timer)}
function start(){
  stopRec();
  session=0;ci=0;si=0;resetStep();
  if(mode==='speech'){phase='setup';renderChips();render();started=true;return}
  deck=shuffle(CATS[cat].items).slice(0,ROUND);
  renderChips();render();
  if(started)speak(cur().auto||cur().speak,.85);
  started=true;
}
function beginSpeech(){
  const ta=$('sp');
  const lines=ta.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,12);
  if(!lines.length)return;
  speechText=lines.join('\n');
  try{localStorage.setItem('ss-speech',speechText)}catch(e){}
  deck=speechCards(lines);ci=0;si=0;session=0;resetStep();
  render();speak(cur().auto||cur().speak,.85);
}
function stopRec(){try{if(rec)rec.abort()}catch(e){}rec=null;listening=false}
function stars(n){return Array.from({length:n},()=>STAR).join('')}

function render(){
  $('total').textContent=total;
  $('note').textContent=micOK
    ?'「はなす」を押して、英語で話します。判定がうまくいかないときは、親御さんが「言えたことにする」を押せます。'
    :'このページではマイクが使えないため、親御さんが判定するモードです。音声で判定するには、ページを自分のURLで開いてください。';
  const st=$('stage');
  if(phase==='setup'){
    st.innerHTML='<label class="sp-label" for="sp">スピーチの文章（1行が1文）</label><textarea class="sp-area" id="sp" spellcheck="false"></textarea><p class="jp">名前や好きなものを、お子さんに合わせて書きかえてください。<br>1文ずつまねする、見ないで言う、ぜんぶ通して言う、の順で練習します。</p><div class="row"><button class="btn primary" id="sp-start">スタート</button><button class="btn" id="sp-reset">もとにもどす</button></div>';
    $('sp').value=speechText;
    $('sp-start').onclick=beginSpeech;
    $('sp-reset').onclick=()=>{$('sp').value=DEFAULT_SPEECH};
    return;
  }
  if(phase==='done'){
    st.innerHTML='<div class="done-card"><h2 class="pop">Great job!</h2><div class="big-stars">'+stars(session)+'</div><p class="jp">'+session+'こ のスターをゲットしました。<br>最後までやりきりました。たくさんほめてあげてください。</p><div class="row"><button class="btn primary" id="again">もういちど あそぶ</button></div></div>';
    $('again').onclick=start;return;
  }
  const item=deck[ci],s=cur();
  const dots=deck.map((_,i)=>'<span class="dot '+(i<ci?'done':i===ci?'now':'')+'"></span>').join('');
  const head='<div class="progress" aria-label="'+(ci+1)+' / '+deck.length+'">'+dots+'</div><div class="pic" aria-hidden="true">'+item[0]+'</div>'+(item[3]?'<p class="jp">'+item[3]+'</p>':'');
  if(phase==='praise'){
    st.innerHTML=head+'<p class="praise pop">'+PRAISE[praiseIdx][1]+'</p><div class="big-stars pop">'+stars(earned)+'</div><p class="say">'+s.target+'</p><div class="row"><button class="btn primary" id="next">つぎへ</button></div>';
    $('next').onclick=advance;return;
  }
  const hidden=s.hidden&&!revealed&&attempts<2;
  let h=head+'<div class="mode">'+(s.open?'じゆうに話そう':s.hidden?'こたえてみよう':'まねして言おう')+'</div>'+
    '<p class="say'+(hidden?' hidden':'')+'">'+(hidden?'? ? ?':(s.open?'れい：':'')+s.target)+'</p>'+
    '<div class="row"><button class="btn primary" id="listen">🔊 きく</button><button class="btn" id="slow">🐢 ゆっくり</button>'+(hidden?'<button class="btn" id="reveal">こたえを見る</button>':'')+'</div>'+
    '<div class="parent"><small>'+s.tip+'</small>';
  if(micOK){
    h+='<button class="btn mic'+(listening?' on':'')+'" id="mic">'+(listening?'🎧 きいてるよ…':'🎤 はなす')+'</button>';
    if(heard)h+='<p class="heard">きこえたこと：“'+heard.replace(/</g,'&lt;')+'”</p>';
    if(msg)h+='<p class="msg'+(warn?' warn':'')+'">'+msg+'</p>';
    h+='<div class="row"><button class="btn small" id="force">言えたことにする</button>'+(attempts>=3?'<button class="btn small" id="skip">つぎへ</button>':'')+'</div>';
  }else{
    if(msg)h+='<p class="msg warn">'+msg+'</p>';
    h+='<div class="row"><button class="btn ok" id="force">⭐ 言えた！</button><button class="btn" id="retry">もういちど</button></div>';
  }
  h+='</div>';
  st.innerHTML=h;
  $('listen').onclick=()=>speak(s.speak,.85);
  $('slow').onclick=()=>speak(s.speak,.55);
  if($('reveal'))$('reveal').onclick=()=>{revealed=true;render();speak(s.target,.85)};
  if($('retry'))$('retry').onclick=()=>speak(s.speak,.75);
  if($('mic'))$('mic').onclick=()=>listening?stopRec()||render():listen();
  if($('force'))$('force').onclick=()=>success();
  if($('skip'))$('skip').onclick=advance;
}

function listen(){
  const s=cur(),item=deck[ci];
  try{speechSynthesis.cancel()}catch(e){}
  let got=false;
  try{
    rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5;rec.continuous=false;
    rec.onresult=e=>{
      got=true;
      const alts=Array.from(e.results[0]).map(a=>a.transcript);
      onHeard(alts,s,item);
    };
    rec.onerror=e=>{
      got=true;
      if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){
        micOK=false;msg='マイクが使えませんでした。親御さんが判定するモードに切り替えます。';warn=true;
      }else if(e.error==='no-speech'){msg='声が聞こえませんでした。もういちど「はなす」を押してね。';warn=false}
      else if(e.error!=='aborted'){msg='うまく聞き取れませんでした。もういちど。';warn=false}
      listening=false;render();
    };
    rec.onend=()=>{if(!got&&listening){listening=false;msg='声が聞こえませんでした。もういちど「はなす」を押してね。';warn=false;render()}};
    listening=true;heard='';msg='';render();
    rec.start();
  }catch(e){micOK=false;listening=false;msg='マイクが使えませんでした。親御さんが判定するモードに切り替えます。';warn=true;render()}
}
function onHeard(alts,s,item){
  listening=false;heard=alts[0];
  const r=judge(s.targets||s.target,s.key,alts,item[4],{need:s.need,minWords:s.minWords});
  if(r.pass){success();return}
  attempts++;warn=false;
  if(s.open){
    msg='もうすこし ながく話してみよう！れいを見てね。';revealed=true;speak('Tell me more! For example, '+s.target,.8);
  }else if(r.keyHit&&s.target!==s.key){
    msg='いいね！もう少しくわしく言ってみよう。';speak('Good! Say, '+s.target,.8);
  }else if(attempts===1){
    msg='おしい！もういちど言ってみよう。';speak('Almost! Try again!',.9);
  }else if(attempts===2){
    msg='おてほんを聞いて、まねしてみよう。';revealed=true;speak('Listen. '+s.target,.8);
  }else{
    msg='だいじょうぶ。「つぎへ」でもOKだよ。';speak('That is okay. Let us say it together. '+s.target,.8);
  }
  render();
}
function success(){
  stopRec();
  earned=attempts===0?2:1;total+=earned;session+=earned;save();
  praiseIdx=Math.floor(Math.random()*PRAISE.length);
  phase='praise';render();
  speak(PRAISE[praiseIdx][0],.9);
  clearTimeout(timer);timer=setTimeout(advance,2600);
}
function advance(){
  clearTimeout(timer);stopRec();
  const n=buildSteps(deck[ci]).length;
  resetStep();
  if(si<n-1){si++}else{si=0;ci++}
  if(ci>=deck.length){phase='done';render();speak('Great job! You are a star!',.9);return}
  render();
  setTimeout(()=>speak(cur().auto||cur().speak,.85),300);
}
try{speechSynthesis.getVoices()}catch(e){}
start();
</script>
